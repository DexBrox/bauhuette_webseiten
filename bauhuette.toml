# Einstellungen der Bauhütte. Gelesen von parlier (python3 -m parlier).
# Einmal pro Projekt anpassen, am einfachsten mit:
#   python3 -m parlier einrichten --name "Mein Projekt" --repo DexBrox/web-mein-projekt --domain beispiel.de

[projekt]
name = "Bauhütte Webseiten"
repo = "DexBrox/web-bauhuette"
# statisch: nur Webseite (SFTP). fullstack: zusätzlich API auf Cloudflare Workers mit Neon-Postgres.
profil = "statisch"
# Live-Domain ohne https://, z. B. "kulturland-hohenlohe.de". Leer, solange es keine gibt.
domain = ""

[zweige]
haupt = "main"      # was live ist
sammel = "develop"  # Sammelstelle bis zum nächsten Release
feature = "feature/"
fix = "fix/"

[pruefen]
# schnell: läuft vor jedem Abschluss einer Claude-Antwort (Hook) und in Ralph nach jeder Runde
schnell = ["pnpm lint", "pnpm typecheck", "pnpm test"]
# voll: vor jedem Pull Request und in der CI
voll = ["pnpm lint", "pnpm typecheck", "pnpm test", "pnpm build"]

[ralph]
befehl = "claude"
modell = "sonnet"
max_issues = 5
max_runden = 80
zeitlimit_min = 45
label = "bereit"

[modelle]
# Wird in den Agenten-Dateien verwendet, hier nur zur Übersicht.
architektur = "opus"
gegenrede = "opus"
umsetzung = "sonnet"
routine = "haiku"

[wiki]
quelle = "docs/hilfe"
ziel = "_site/hilfe"
quartz = "v5.2.0"
konfig = "wiki/quartz.config.yaml"
stil = "wiki/custom.scss"

[ueberwachung]
# Pfade, die auf der Live-Seite erreichbar sein müssen
seiten = ["/", "/impressum/", "/datenschutz/", "/hilfe/"]
zertifikat_tage = 14

# Labels, die parlier labels auf GitHub anlegt oder aktualisiert
