name: "Issues: auf develop angekommen"

# GitHub schließt Issues erst, wenn "Closes #12" auf main landet (beim Release).
# Damit Ralph und der Lagebericht trotzdem wissen, was schon gebaut ist, bekommt ein Issue
# beim Zusammenführen nach develop das Label "fertig".

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  issues: write
  pull-requests: read

jobs:
  fertig:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Label setzen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TEXT: ${{ github.event.pull_request.body }}
        run: |
          for nr in $(printf '%s' "$TEXT" | grep -oiE '(closes|fixes|resolves) #[0-9]+' | grep -oE '[0-9]+' | sort -u); do
            gh issue edit "$nr" --add-label fertig --remove-label in-review --remove-label in-arbeit || true
            echo "#$nr ist fertig (auf develop)"
          done
