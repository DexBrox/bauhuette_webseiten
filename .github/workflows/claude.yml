name: "Claude: Issues und Pull Requests"

# 1. "@claude" in einem Issue oder Kommentar (nur von Vale und Mitarbeitenden): Claude antwortet oder setzt um.
# 2. Label "claude" an einem Issue: Claude sichtet es (Labels, Dubletten, Rückfragen, Akzeptanzkriterien), ohne Code.
# Kostet Actions-Minuten und Nutzung. Secret CLAUDE_CODE_OAUTH_TOKEN (claude setup-token, Abo)
# oder ANTHROPIC_API_KEY. Ohne Secret schlägt der Lauf sofort fehl.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  erwaehnung:
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model sonnet --max-turns 30"

  sichten:
    if: >-
      github.event_name == 'issues' &&
      (github.event.action == 'labeled' && github.event.label.name == 'claude')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model haiku --max-turns 10"
          prompt: |
            Sichte Issue #${{ github.event.issue.number }} in ${{ github.repository }}. Ändere keinen Code.
            1. Passende Labels aus bauhuette.toml setzen (wunsch, fehler, inhalt, technik, design, recht, betrieb),
               das Label claude entfernen.
            2. Offene Issues nach Dubletten durchsuchen, gefundene verlinken.
            3. Einen Kommentar auf Deutsch schreiben, ohne Gedankenstriche: Zusammenfassung in einem Satz,
               Vorschlag für Akzeptanzkriterien als Checkliste, höchstens drei Rückfragen.
            4. Ist es reiner Inhalt (Text, Bild, Termin), auf die Redaktion hinweisen.
